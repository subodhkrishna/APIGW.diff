# API Gateway Configurations
# Environment variables can be referenced using ${VAR_NAME} syntax

gateways:
  kong:
    enabled: false
    proxy_url: "${KONG_PROXY_URL:https://kong.example.com}"
    admin_url: "${KONG_ADMIN_URL:https://kong-admin.example.com}"
    credentials:
      api_key: "${KONG_API_KEY:}"

  aws_api_gateway:
    enabled: false
    # Option 1: Provide full URL
    url: "${AWS_API_GATEWAY_URL:}"
    # Option 2: Provide API ID and region (URL will be constructed)
    region: "${AWS_REGION:us-east-1}"
    api_id: "${AWS_API_ID:}"
    stage: "${AWS_STAGE:prod}"
    credentials:
      api_key: "${AWS_API_KEY:}"
      # AWS credentials can also use default credential chain

  nginx:
    enabled: false
    url: "${NGINX_URL:https://nginx.example.com}"
    api_url: "${NGINX_API_URL:}"  # Optional NGINX Plus API

  traefik:
    enabled: false
    url: "${TRAEFIK_URL:https://traefik.example.com}"
    api_url: "${TRAEFIK_API_URL:https://traefik-api.example.com}"

  envoy:
    enabled: false
    url: "${ENVOY_URL:https://envoy.example.com}"
    admin_url: "${ENVOY_ADMIN_URL:https://envoy-admin.example.com}"

